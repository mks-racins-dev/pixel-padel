name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_ANALYTICS_URL: ${{ vars.ANALYTICS_URL }}
          VITE_SERVER_URL: ${{ vars.SERVER_URL }}
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Deploys the game server to Cloudflare. Runs only once the repository has the
  # CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets (see README, "Game server").
  deploy-server:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
        if: env.HAS_CF == 'true'
      - uses: actions/setup-node@v7
        if: env.HAS_CF == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: env.HAS_CF == 'true'
      - run: npm run server:deploy
        if: env.HAS_CF == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: echo "No Cloudflare secrets yet, skipping the game server deploy."
        if: env.HAS_CF != 'true'
