<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pixel Padel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--u:2px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#17131c;overflow:hidden;color:#f4ead2;font-family:VT323,monospace;-webkit-user-select:none;user-select:none;touch-action:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;overflow:hidden;box-shadow:0 0 0 calc(var(--u)*2) #0c0a10}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.px{font-family:"Press Start 2P",monospace}
.panel{background:#2a2333;border:calc(var(--u)*2) solid #0f0c13;box-shadow:inset 0 0 0 var(--u) #4a3f58,calc(var(--u)*2) calc(var(--u)*2) 0 rgba(0,0,0,.45)}
button{font:inherit;color:inherit;cursor:pointer}
#hud{position:absolute;inset:0;pointer-events:none}
#board{position:absolute;left:calc(var(--u)*6);top:calc(var(--u)*6);padding:calc(var(--u)*3) calc(var(--u)*5);display:grid;gap:calc(var(--u)*2)}
.row{display:grid;grid-template-columns:calc(var(--u)*6) calc(var(--u)*64) calc(var(--u)*12) calc(var(--u)*16);align-items:center;font-size:calc(var(--u)*6)}
.row .g{text-align:center;color:#f4ead2}
.row .pt{text-align:center;background:#f4ead2;color:#17131c;padding:calc(var(--u)*1) 0}
.row .srv{width:calc(var(--u)*3);height:calc(var(--u)*3);background:#e2ef3c;box-shadow:0 0 0 var(--u) #17131c;visibility:hidden}
.row.serving .srv{visibility:visible}
#r0 .nm{color:#ff8a5c}#r1 .nm{color:#6fd3d2}
#info{position:absolute;right:calc(var(--u)*28);top:calc(var(--u)*8);font-size:calc(var(--u)*8);color:#f4ead2;text-shadow:var(--u) var(--u) 0 #17131c}
#pauseBtn{position:absolute;right:calc(var(--u)*6);top:calc(var(--u)*6);width:calc(var(--u)*18);height:calc(var(--u)*18);pointer-events:auto;font-size:calc(var(--u)*6);padding:0}
.epanel{position:absolute;bottom:calc(var(--u)*6);padding:calc(var(--u)*3) calc(var(--u)*5);width:calc(var(--u)*92);font-size:calc(var(--u)*5)}
#e0{left:calc(var(--u)*6)}#e1{right:calc(var(--u)*6)}
.elab{color:#c9bba6}.enm{color:#ff8a5c}#e1 .enm{color:#6fd3d2}
.ebar{margin-top:calc(var(--u)*2);height:calc(var(--u)*5);background:#3a3146;border:var(--u) solid #0f0c13}
.ebar i{display:block;height:100%;width:0;background:#f2c14e}
.epanel.full .ebar i{background:#ff8a5c;animation:blink .25s steps(1) infinite}
@keyframes blink{50%{background:#fff1c1}}
.ehint{margin-top:calc(var(--u)*2);font-size:calc(var(--u)*4.5);color:#7d7764;min-height:calc(var(--u)*5)}
.epanel.full .ehint{color:#ff8a5c}
.epanel[hidden]{display:none}
#msg{position:absolute;left:0;right:0;top:34%;text-align:center;pointer-events:none;opacity:0;transition:opacity .15s}
#msg.show{opacity:1}
#msgBig{display:inline-block;font-size:calc(var(--u)*12);color:#f4ead2;text-shadow:calc(var(--u)*1.5) calc(var(--u)*1.5) 0 #17131c;padding:calc(var(--u)*4) calc(var(--u)*8);background:rgba(23,19,28,.55)}
#msgSmall{margin-top:calc(var(--u)*4);font-size:calc(var(--u)*11);text-shadow:var(--u) var(--u) 0 #17131c}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(23,19,28,.35)}
.overlay[hidden],#hud[hidden],#touch[hidden]{display:none}
#menuBox{width:calc(var(--u)*300);padding:calc(var(--u)*8) calc(var(--u)*12) calc(var(--u)*9);display:flex;flex-direction:column;gap:calc(var(--u)*5)}
h1{margin:0;font-size:calc(var(--u)*17);line-height:1.1;color:#f7c993;text-shadow:calc(var(--u)*2) calc(var(--u)*2) 0 #b8483a,calc(var(--u)*3) calc(var(--u)*3) 0 #0f0c13;text-align:center}
.sub{text-align:center;font-size:calc(var(--u)*9);color:#c9bba6;margin-top:calc(var(--u)*-2)}
.opt{display:grid;grid-template-columns:calc(var(--u)*56) 1fr;align-items:center;gap:calc(var(--u)*4)}
.opt>span{font-size:calc(var(--u)*5);color:#c9bba6}
.seg{display:flex;gap:calc(var(--u)*3)}
.seg button{flex:1;font-family:"Press Start 2P",monospace;font-size:calc(var(--u)*5);padding:calc(var(--u)*4) calc(var(--u)*2);background:#3a3146;border:calc(var(--u)*1.5) solid #0f0c13;box-shadow:inset 0 calc(var(--u)*-1.5) 0 #2a2333}
.seg button[aria-pressed="true"]{background:#e4572e;color:#fff;box-shadow:inset 0 calc(var(--u)*-1.5) 0 #a83b1d}
.seg button:hover{filter:brightness(1.15)}
.big{font-family:"Press Start 2P",monospace;font-size:calc(var(--u)*9);padding:calc(var(--u)*6);background:#4f9a5b;color:#fff;border:calc(var(--u)*2) solid #0f0c13;box-shadow:inset 0 calc(var(--u)*-2.5) 0 #2f6b3a}
.big:hover{filter:brightness(1.1)}
.big.alt{background:#3a3146;box-shadow:inset 0 calc(var(--u)*-2.5) 0 #2a2333}
.tabs{display:flex;gap:calc(var(--u)*3)}
.tabs button{flex:1;font-size:calc(var(--u)*5.5);padding:calc(var(--u)*4) calc(var(--u)*2);background:#211b29;color:#c9bba6;border:calc(var(--u)*1.5) solid #0f0c13}
.tabs button[aria-selected="true"]{background:#f2c14e;color:#17131c;box-shadow:inset 0 calc(var(--u)*-1.5) 0 #b88a25}
.secs{height:calc(var(--u)*128)}
.sec[data-sec="play"]{gap:calc(var(--u)*4)}
.seg.venue{flex-wrap:wrap;gap:calc(var(--u)*2)}
.seg.venue button{flex:1 0 22%;font-size:calc(var(--u)*4);padding:calc(var(--u)*3) calc(var(--u)*1)}
.sec{display:flex;flex-direction:column;gap:calc(var(--u)*5)}
.sec[hidden]{display:none}
.pl{display:grid;grid-template-columns:calc(var(--u)*72) 1fr;gap:calc(var(--u)*6);align-items:start}
#prevC{width:calc(var(--u)*72);height:calc(var(--u)*90);background:#3f6b45;box-shadow:0 0 0 calc(var(--u)*1.5) #0f0c13,inset 0 calc(var(--u)*-14) 0 #2f63b0}
.popts{display:flex;flex-direction:column;gap:calc(var(--u)*3.5)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*4)}
.o2{display:grid;grid-template-columns:calc(var(--u)*25) 1fr;align-items:center;gap:calc(var(--u)*2)}
.o2>span{font-size:calc(var(--u)*3.5);color:#c9bba6}
.popts .seg{gap:calc(var(--u)*2)}
.popts .seg button{font-size:calc(var(--u)*3.5);padding:calc(var(--u)*3) calc(var(--u)*1)}
.popts .sw{gap:calc(var(--u)*1.5)}
.popts .sw button{flex:0 0 auto;width:calc(var(--u)*9);height:calc(var(--u)*9);padding:0;border:var(--u) solid #0f0c13;box-shadow:none;font-size:calc(var(--u)*5);color:#c9bba6;line-height:1}
.popts .sw button[aria-pressed="true"]{box-shadow:0 0 0 var(--u) #fff1c1}
#styleInfo{font-size:calc(var(--u)*7.5)}
.help{font-size:calc(var(--u)*8.5);line-height:1.05;color:#d9ccb6}
.help b{color:#f7c993;font-weight:normal}
.btns{display:flex;gap:calc(var(--u)*4)}
.btns .big{flex:1}
#endBox,#pauseBox{width:calc(var(--u)*220);padding:calc(var(--u)*10);display:flex;flex-direction:column;gap:calc(var(--u)*6);text-align:center}
#onBox{width:calc(var(--u)*240);padding:calc(var(--u)*10);display:flex;flex-direction:column;gap:calc(var(--u)*6);text-align:center}
#onBox .t{font-size:calc(var(--u)*11);color:#f7c993}
#codeShow{font-size:calc(var(--u)*16);color:#ff8a5c;letter-spacing:.2em;min-height:calc(var(--u)*16)}
#codeIn{flex:1;min-width:0;font-family:"Press Start 2P",monospace;font-size:calc(var(--u)*9);text-align:center;letter-spacing:.3em;padding:calc(var(--u)*4);background:#17131c;color:#f4ead2;border:calc(var(--u)*1.5) solid #0f0c13;text-transform:uppercase;-webkit-user-select:text;user-select:text}
#onStatus{min-height:calc(var(--u)*18)}
#endTitle{font-size:calc(var(--u)*13);color:#f7c993;text-shadow:calc(var(--u)*1.5) calc(var(--u)*1.5) 0 #0f0c13}
#endScore{font-size:calc(var(--u)*14)}
#touch{position:absolute;inset:0;pointer-events:none}
#stick{position:absolute;left:calc(var(--u)*14);bottom:calc(var(--u)*14);width:calc(var(--u)*64);height:calc(var(--u)*64);border-radius:50%;background:rgba(244,234,210,.12);border:calc(var(--u)*1.5) solid rgba(244,234,210,.35);pointer-events:auto;touch-action:none}
#nub{position:absolute;left:50%;top:50%;width:calc(var(--u)*24);height:calc(var(--u)*24);margin:calc(var(--u)*-12) 0 0 calc(var(--u)*-12);border-radius:50%;background:rgba(244,234,210,.55)}
.tbtn{position:absolute;bottom:calc(var(--u)*16);width:calc(var(--u)*44);height:calc(var(--u)*44);border-radius:50%;pointer-events:auto;touch-action:none;font-family:"Press Start 2P",monospace;font-size:calc(var(--u)*5.5);border:calc(var(--u)*1.5) solid rgba(15,12,19,.8)}
#tDrive{right:calc(var(--u)*14);background:rgba(228,87,46,.75);color:#fff}
#tVib{right:calc(var(--u)*14);bottom:calc(var(--u)*66);width:calc(var(--u)*34);height:calc(var(--u)*34);background:rgba(142,108,193,.8);color:#fff}
#tLob{right:calc(var(--u)*64);bottom:calc(var(--u)*34);background:rgba(79,154,91,.75);color:#fff}
#rotate{display:none;position:fixed;inset:0;background:#17131c;color:#f4ead2;align-items:center;justify-content:center;text-align:center;font-size:28px;padding:24px;z-index:9}
@media (orientation:portrait) and (pointer:coarse){#rotate{display:flex}}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="c" width="480" height="270" aria-label="Pixel padel court"></canvas>

  <div id="hud" hidden>
    <div id="board" class="panel px">
      <div class="row" id="r0"><span class="srv"></span><span class="nm">YOU</span><span class="g">0</span><span class="pt">0</span></div>
      <div class="row" id="r1"><span class="srv"></span><span class="nm">CPU</span><span class="g">0</span><span class="pt">0</span></div>
    </div>
    <div id="info"></div>
    <button id="pauseBtn" class="panel px" aria-label="Pause">II</button>
    <div class="epanel panel px" id="e0"><div class="elab"><span class="enm">P1</span> ENERGY</div><div class="ebar"><i></i></div><div class="ehint"></div></div>
    <div class="epanel panel px" id="e1"><div class="elab"><span class="enm">P2</span> ENERGY</div><div class="ebar"><i></i></div><div class="ehint"></div></div>
  </div>

  <div id="msg"><div id="msgBig" class="px"></div><div id="msgSmall"></div></div>

  <div id="touch" hidden>
    <div id="stick"><div id="nub"></div></div>
    <button class="tbtn" id="tLob">LOB</button>
    <button class="tbtn" id="tDrive">HIT</button>
    <button class="tbtn" id="tVib">VIB</button>
  </div>

  <div id="menu" class="overlay">
    <div id="menuBox" class="panel">
      <h1 class="px">PIXEL PADEL</h1>
      <div class="sub" id="sub">sunset club · glass walls in play</div>
      <div class="tabs" id="tabs">
        <button class="px" data-sec="play" aria-selected="true">PLAY</button>
        <button class="px" data-sec="player" aria-selected="false">PLAYER</button>
        <button class="px" data-sec="help" aria-selected="false">HOW TO</button>
      </div>
      <div class="secs">
      <div class="sec" data-sec="play">
      <div class="opt"><span class="px">MODE</span>
        <div class="seg" data-key="mode">
          <button data-v="1v1" aria-pressed="true">1 VS 1</button>
          <button data-v="2v2" aria-pressed="false">2 VS 2</button>
          <button data-v="pvp" aria-pressed="false">2 PLAYERS</button>
          <button data-v="online" aria-pressed="false">ONLINE</button>
        </div></div>
      <div class="opt"><span class="px">VENUE</span>
        <div class="seg venue" data-key="loc">
          <button data-v="sunset">SUNSET</button><button data-v="lv">LATVIA</button><button data-v="ee">ESTONIA</button><button data-v="lt">LITHUANIA</button>
          <button data-v="es">SPAIN</button><button data-v="by">BELARUS</button><button data-v="us">USA</button><button data-v="ru">RUSSIA</button>
        </div></div>
      <div class="opt"><span class="px">CPU</span>
        <div class="seg" data-key="diff">
          <button data-v="easy" aria-pressed="false">EASY</button>
          <button data-v="normal" aria-pressed="true">NORMAL</button>
          <button data-v="hard" aria-pressed="false">HARD</button>
        </div></div>
      <div class="opt"><span class="px">MATCH</span>
        <div class="seg" data-key="games">
          <button data-v="3" aria-pressed="true">FIRST TO 3</button>
          <button data-v="6" aria-pressed="false">FIRST TO 6</button>
        </div></div>
      <div class="opt"><span class="px">ASSIST</span>
        <div class="seg" data-key="assist">
          <button data-v="on" aria-pressed="true">BOUNCE MARK</button>
          <button data-v="off" aria-pressed="false">OFF</button>
        </div></div>
      </div>
      <div class="sec" data-sec="player" hidden>
        <div class="pl">
          <canvas id="prevC" width="24" height="30" aria-label="Player preview"></canvas>
          <div class="popts">
            <div class="pair">
              <div class="o2"><span class="px">LOOK</span><div class="seg" data-look="gender"><button data-v="boy">BOY</button><button data-v="girl">GIRL</button></div></div>
              <div class="o2"><span class="px">HAND</span><div class="seg" data-look="hand"><button data-v="right">RIGHT</button><button data-v="left">LEFT</button></div></div>
            </div>
            <div class="o2"><span class="px">STYLE</span>
              <div class="seg" data-key="style">
                <button data-v="allround">ALL-ROUND</button>
                <button data-v="speed">SPEEDSTER</button>
                <button data-v="power">POWER</button>
                <button data-v="sniper">SNIPER</button>
              </div></div>
            <div class="pair">
              <div class="o2"><span class="px">SKIN</span><div class="seg sw" data-look="skin"></div></div>
              <div class="o2"><span class="px">HAIR</span><div class="seg sw" data-look="hair"></div></div>
            </div>
            <div class="pair">
              <div class="o2"><span class="px">SHIRT</span><div class="seg sw" data-look="shirt"></div></div>
              <div class="o2"><span class="px">BOTTOM</span><div class="seg sw" data-look="shorts"></div></div>
            </div>
            <div class="pair">
              <div class="o2"><span class="px">RACKET</span><div class="seg sw" data-look="frame"></div></div>
              <div class="o2"><span class="px">BAND</span><div class="seg sw" data-look="band"></div></div>
            </div>
          </div>
        </div>
        <div class="help" id="styleInfo"></div>
      </div>
      <div class="sec" data-sec="help" hidden><div class="help" id="help"></div></div>
      </div>
      <button class="big" id="playBtn">PLAY ▸</button>
    </div>
  </div>

  <div id="online" class="overlay" hidden>
    <div id="onBox" class="panel">
      <div class="px t">PLAY ONLINE</div>
      <button class="big" id="hostBtn">HOST A GAME</button>
      <div id="codeShow" class="px"></div>
      <div class="btns"><input id="codeIn" maxlength="4" placeholder="CODE" autocomplete="off" spellcheck="false" aria-label="Room code"><button class="big alt" id="joinBtn">JOIN</button></div>
      <div id="onStatus" class="help">Host to get a code, or type a friend's code and join.</div>
      <button class="big alt" id="onBack">BACK</button>
    </div>
  </div>

  <div id="pause" class="overlay" hidden>
    <div id="pauseBox" class="panel">
      <div id="endTitle2" class="px" style="font-size:calc(var(--u)*13);color:#f7c993">PAUSED</div>
      <button class="big" id="resumeBtn">RESUME</button>
      <button class="big alt" id="soundBtn">SOUND: ON</button>
      <button class="big alt" id="quitBtn">QUIT TO MENU</button>
    </div>
  </div>

  <div id="end" class="overlay" hidden>
    <div id="endBox" class="panel">
      <div id="endTitle" class="px">YOU WIN!</div>
      <div id="endScore" class="px">3 – 1</div>
      <div class="btns"><button class="big" id="againBtn">REMATCH</button><button class="big alt" id="menuBtn">MENU</button></div>
    </div>
  </div>
</div></div>
<div id="rotate">Turn your phone sideways to play</div>

<script>
'use strict';
const W=480,H=270;
const cv=document.getElementById('c');const ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;

/* ---------------- projection ---------------- */
const CAM=[0,-30,17],TGT=[0,0.5,0],FOC=520,CX=240,CY=150;
const FW=(()=>{const d=[TGT[0]-CAM[0],TGT[1]-CAM[1],TGT[2]-CAM[2]];const l=Math.hypot(d[0],d[1],d[2]);return d.map(v=>v/l)})();
const UP=[0,-FW[2],FW[1]];
function P(x,y,z){const dx=x-CAM[0],dy=y-CAM[1],dz=z-CAM[2];const zc=dx*FW[0]+dy*FW[1]+dz*FW[2];const k=FOC/zc;return{x:CX+k*dx,y:CY-k*(dy*UP[1]+dz*UP[2]),s:k}}

/* ---------------- helpers ---------------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let rnd=mulberry(7);
function R(g,x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),Math.max(1,Math.round(w)),Math.max(1,Math.round(h)))}
function L(g,x0,y0,x1,y1,c,t){t=t||1;x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);g.fillStyle=c;const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy;for(let i=0;i<3000;i++){g.fillRect(x0,y0,t,t);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx}if(e2<=dx){e+=dx;y0+=sy}}}
function poly(g,pts,c){g.fillStyle=c;let a=1e9,b=-1e9;for(const p of pts){a=Math.min(a,p.y);b=Math.max(b,p.y)}const spans=[];
  for(let y=Math.ceil(a-0.5);y<=Math.floor(b-0.5);y++){const yc=y+0.5,xs=[];for(let i=0;i<pts.length;i++){const p=pts[i],q=pts[(i+1)%pts.length];if((p.y<=yc&&q.y>yc)||(q.y<=yc&&p.y>yc))xs.push(p.x+(yc-p.y)*(q.x-p.x)/(q.y-p.y))}
  xs.sort((m,n)=>m-n);for(let k=0;k+1<xs.length;k+=2){const x0=Math.round(xs[k]),x1=Math.round(xs[k+1]);if(x1>x0){g.fillRect(x0,y,x1-x0,1);spans.push([y,x0,x1])}}}return spans}
function WL(g,a,b,c,t){const p=P(a[0],a[1],a[2]),q=P(b[0],b[1],b[2]);L(g,p.x,p.y,q.x,q.y,c,t)}
function WQ(g,pts,c){return poly(g,pts.map(p=>P(p[0],p[1],p[2])),c)}
function circ(g,cx,cy,r,c){g.fillStyle=c;const n=Math.ceil(r);for(let y=-n;y<=n;y++){const hw=Math.floor(Math.sqrt(Math.max(0,r*r-y*y)));g.fillRect(Math.round(cx-hw),Math.round(cy+y),hw*2+1,1)}}
function ring(g,cx,cy,r,c){g.fillStyle=c;for(let a=0;a<64;a++){const t=a/64*Math.PI*2;g.fillRect(Math.round(cx+Math.cos(t)*r),Math.round(cy+Math.sin(t)*r),1,1)}}

  if(type==='drive'&&opp.every(q=>Math.abs(q.y)>6.8)&&Math.random()<0.28)power=0.08+Math.random()*0.14;

}

/* ---------------- input ---------------- */
const keys={};const touchIn={mx:0,my:0};
const SCHEMES={
  solo:{up:['KeyW','ArrowUp'],down:['KeyS','ArrowDown'],left:['KeyA','ArrowLeft'],right:['KeyD','ArrowRight'],drive:['Space','KeyJ'],lob:['KeyK','ShiftLeft','ShiftRight'],vib:['KeyL','KeyE']},
  p1:{up:['KeyW'],down:['KeyS'],left:['KeyA'],right:['KeyD'],drive:['KeyF'],lob:['KeyG'],vib:['KeyR']},
  p2:{up:['ArrowUp'],down:['ArrowDown'],left:['ArrowLeft'],right:['ArrowRight'],drive:['KeyK','Enter'],lob:['KeyL'],vib:['KeyO']}
};
function schemeOf(p){if(settings.mode==='pvp')return p.ctrl==='h1'?SCHEMES.p1:SCHEMES.p2;return SCHEMES.solo}
function inputOf(p){if(p.ctrl==='net')return(net&&net.remoteIn)||{mx:0,my:0};const s=schemeOf(p);const on=a=>a.some(k=>keys[k]);let mx=(on(s.right)?1:0)-(on(s.left)?1:0),my=(on(s.up)?1:0)-(on(s.down)?1:0);if(p.ctrl==='h1'&&(touchIn.mx||touchIn.my)){mx=touchIn.mx;my=touchIn.my}return{mx,my}}
addEventListener('keydown',e=>{
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  if(e.repeat){keys[e.code]=true;return}
  keys[e.code]=true;
  if((e.code==='Escape'||e.code==='KeyP')&&!demo&&state!=='menu'&&document.getElementById('end').hidden){togglePause();return}
  if(demo||paused)return;
  for(const p of players){if(!isHuman(p)||p.ctrl==='net')continue;const s=schemeOf(p);if(s.drive.includes(e.code))actStart(p,'drive');else if(s.lob.includes(e.code))actStart(p,'lob');else if(s.vib.includes(e.code))actVib(p)}
});
addEventListener('keyup',e=>{keys[e.code]=false;if(demo)return;for(const p of players){if(!isHuman(p)||p.ctrl==='net')continue;const s=schemeOf(p);for(const a of['drive','lob'])if(s[a].includes(e.code))actRelease(p,a)}});
const isGuest=()=>!!(net&&net.role==='guest'&&!demo);
function actStart(p,a){if(isGuest())netSend({t:'d',a});else startCharge(p,a)}
function actRelease(p,a){if(isGuest())netSend({t:'u',a});else if(p.charging===a)releaseCharge(p)}
function actVib(p){if(isGuest())netSend({t:'v'});else tryVibora(p)}
function startCharge(p,type){if(p.charging)return;p.charging=type;p.charge=0}
function releaseCharge(p){if(!p.charging)return;p.swingReq=p.charging;p.reqPower=Math.max(0.06,p.charge);p.charging=null;p.charge=0}
function tryVibora(p){if(state==='serve'&&R0.server===p){p.swingReq='drive';p.reqPower=sweet(p);return}if(p.energy>=100){p.swingReq='vibora';p.reqPower=1}else{floats.push({x:p.x,y:p.y,t:0.7,text:'NOT READY',c:'#c9bba6'})}}
addEventListener('blur',()=>{for(const k in keys)keys[k]=false});

/* ---------------- update ---------------- */
const STEP=1/120;
function update(dt){
  time+=dt;
  if(state==='serve'){
    const srv=R0.server;stateT-=dt;
    ball.x=srv.x+(srv.team===0?0.35:-0.35);ball.y=srv.y+(srv.team===0?0.25:-0.25);ball.z=0.55+Math.abs(Math.sin(time*5))*0.5;
    if(isHuman(srv)){if(srv.swingReq){srv.swingReq=null;doServe(srv,srv.reqPower)}}
    else if(stateT<=0)doServe(srv,0);
  }else if(state==='play'){
    stepBall(ball,dt,onEvent);
    if(state==='play'&&ball.rolling&&R0.bounces>=1)endPoint(R0.lastTeam,'DOUBLE BOUNCE');
  }else if(state==='between'){
    stepBall(ball,dt,soundOnly);
    stateT-=dt;if(stateT<=0&&afterState){const f=afterState;afterState=null;hideMsg();f()}
  }
  for(const t of[0,1]){const m=teamOf(t);if(m.some(q=>!isHuman(q))){const q0=m.find(q=>!isHuman(q));q0.think-=dt;if(q0.think<=0){q0.think=0.08+Math.random()*0.06;if(state==='play')aiPlan(t);else for(const q of m)if(!isHuman(q)&&state!=='serve'){q.tx=q.x;q.ty=q.y}}}}
  for(const p of players){
    const lim=p.team===0?[-9.7,-0.5]:[0.5,9.7];
    if(isHuman(p)){
      const i=inputOf(p);const l=Math.hypot(i.mx,i.my)||1;const sc=Math.min(1,Math.hypot(i.mx,i.my));
      const serving=state==='serve'&&R0.server===p,locked=serving&&p.charging;
      if(locked&&i.mx)p.serveAim=Math.max(0,Math.min(1,p.serveAim+i.mx*R0.boxX*dt*1.1));
      p.vx=locked?0:i.mx/l*SPEED_H*movK(p)*sc;p.vy=locked?0:i.my/l*SPEED_H*movK(p)*sc;
      if(p.charging)p.charge=Math.min(1,p.charge+dt/0.75);
      if(state==='play'&&p.swingReq&&p.swingT<=0.06){if(p.swingReq==='vibora'&&p.energy<100){p.swingReq=null}else{p.swingT=0.3;p.swingType=p.swingReq;p.power=p.reqPower;p.hitDone=false;p.swingReq=null}}
      if(p.swingT>0&&!p.hitDone&&canHit(p)){const aim=i.mx<-0.3?-3.7:i.mx>0.3?3.7:(-Math.sign(p.x||0.1)*2.2+(Math.random()-0.5)*1.2);performHit(p,p.swingType,aim,p.power)}
    }else{
      const D=diffOf(p);
      if(state==='serve'||state==='between'){p.vx*=0.8;p.vy*=0.8}else{
        const dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy);
        if(d>0.06){const v=Math.min(D.spd*movK(p),d*7);p.vx=dx/d*v;p.vy=dy/d*v}else{p.vx=p.vy=0}}
      if(canHit(p)){if(p.missLeg!==R0.hits){p.missLeg=R0.hits;p.willMiss=Math.random()<D.miss}if(!p.willMiss){const s=aiShot(p);p.swingT=0.3;p.swingType=s.type;performHit(p,s.type,s.aimX,s.power)}}
    }
    if(p.swingT>0)p.swingT-=dt;
    p.x=Math.max(-4.7,Math.min(4.7,p.x+p.vx*dt));p.y=Math.max(lim[0],Math.min(lim[1],p.y+p.vy*dt));
    if(state==='serve'&&R0.server===p){const sd=-R0.boxX;p.x=sd>0?Math.max(0.3,p.x):Math.min(-0.3,p.x);if(Math.abs(p.y)<SVC+0.5)p.y=Math.sign(p.y)*(SVC+0.5)}
    const sp=Math.hypot(p.vx,p.vy);if(sp>0.4)p.anim+=dt*sp*2.2;
    if(!ball.held)p.flip=ball.x<p.x-0.15;
  }
  if(shake>0)shake-=dt;
  for(const s of spectators)if(s.cheer>0)s.cheer-=dt;
  if(floatTxt){floatTxt.t-=dt;if(floatTxt.t<=0)floatTxt=null}
  for(const f of floats)f.t-=dt;floats=floats.filter(f=>f.t>0);
  if(!demo&&score)updateEnergy();
}

    if(m.t==='bye'){handleLeft();return}

    else if(m.t==='d'&&(m.a==='drive'||m.a==='lob'))startCharge(p,m.a);
    else if(m.t==='u'){if(p.charging===m.a)releaseCharge(p)}

  }else{
    if(m.t==='start'){settings.games=m.games;net.styles=m.styles;net.looks=Array.isArray(m.looks)?m.looks:[];if(LOCS[m.loc])setLoc(m.loc);net.snap=null;net.hk='';showGameUI();newMatch(false)}
    else if(m.t==='s'){if(!demo)applySnap(m)}

}
const r3=v=>Math.round(v*1000)/1000;
function mkSnap(){return{t:'s',st:state,b:[r3(ball.x),r3(ball.y),r3(ball.z),r3(ball.vx),r3(ball.vy),r3(ball.vz),ball.held?1:0,ball.out?1:0,ball.vib?1:0,ball.spin||0],
  P:players.map(p=>[r3(p.x),r3(p.y),r3(p.vx),r3(p.vy),r3(p.swingT),p.swingType,p.flip?1:0,r3(p.anim),Math.round(p.energy),p.charging||0,r3(p.charge),r3(p.serveAim)]),
  sc:score,r:[players.indexOf(R0.server),R0.boxX,R0.serve?1:0],mk:marker,ft:floatTxt,fl:floats,sh:r3(Math.max(0,shake)),fx:net.fx.splice(0)}}
function applySnap(m){
  net.snap=m;net.snapAt=performance.now();if(state!=='over')state=m.st;
  const b=m.b;ball.x=b[0];ball.y=b[1];ball.z=b[2];ball.vx=b[3];ball.vy=b[4];ball.vz=b[5];ball.held=!!b[6];ball.out=!!b[7];ball.vib=!!b[8];ball.spin=b[9];
  m.P.forEach((a,i)=>{const p=players[i];if(!p)return;p.x=a[0];p.y=a[1];p.vx=a[2];p.vy=a[3];p.swingT=a[4];p.swingType=a[5];p.flip=!!a[6];p.anim=a[7];p.energy=a[8];p.charging=a[9]||null;p.charge=a[10];p.serveAim=a[11]});
  score=m.sc;R0=R0||{};R0.server=players[m.r[0]]||players[0];R0.boxX=m.r[1];R0.serve=!!m.r[2];
  marker=m.mk;floatTxt=m.ft;floats=m.fl||[];if(m.sh>shake)shake=m.sh;
  for(const x of m.fx||[])sfx(x[0],x[1]);
  const k=JSON.stringify(score);if(k!==net.hk){net.hk=k;updateHud()}
}
function guestTick(dt){
  time+=dt;if(shake>0)shake-=dt;for(const sp of spectators)if(sp.cheer>0)sp.cheer-=dt;
  const m=net.snap;
  if(m){const t=Math.min(0.07,(performance.now()-net.snapAt)/1000),b=m.b;
    if(!b[6]&&m.st!=='serve'){ball.x=b[0]+b[3]*t;ball.y=b[1]+b[4]*t;ball.z=Math.max(0,b[2]+b[5]*t-0.5*G*t*t)}
    m.P.forEach((a,i)=>{const p=players[i];if(p){p.x=a[0]+a[2]*t;p.y=a[1]+a[3]*t}})}
  const me=players.find(q=>q.ctrl==='h1');
  if(me){const i=inputOf(me),mx=Math.round(i.mx*100)/100,my=Math.round(i.my*100)/100;net.inT-=dt;
    if(mx!==net.inp.mx||my!==net.inp.my||net.inT<=0){net.inp={mx,my};net.inT=0.3;netSend({t:'m',mx,my})}}
  if(score)updateEnergy();
}
$('hostBtn').onclick=()=>{initAudio();hostGame()};
$('joinBtn').onclick=()=>{initAudio();joinGame()};
$('codeIn').addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter')joinGame()});
$('codeIn').addEventListener('keyup',e=>e.stopPropagation());
$('onBack').onclick=()=>{netClose();$('online').hidden=true;$('menu').hidden=false};

/* ---------------- sizing & loop ---------------- */
function fit(){const s0=Math.min(innerWidth/W,innerHeight/H);const s=s0>=2?Math.floor(s0):s0;const st=$('stage');st.style.width=W*s+'px';st.style.height=H*s+'px';document.documentElement.style.setProperty('--u',s+'px')}
addEventListener('resize',fit);fit();
BG=buildBg();NET=buildNet();$('sub').textContent=curLoc().sub+' · glass walls in play';FRONT=buildFront();
rnd=mulberry(5);
const SPEC=[['#e86a6a','#2d2a3a','#e8b48a','#4a2c1a'],['#f4ead2','#3b5b8c','#8d5a3b','#1f1a17'],['#6fae5f','#2d2a3a','#f0c4a0','#d9b26a'],['#8e6cc1','#5a3b2c','#c98d62','#2b1d14'],['#f2c14e','#1f2a44','#e8b48a','#7a3a22'],['#3fa7a8','#2d2a3a','#b97a52','#1f1a17'],['#d98ca0','#3b5b8c','#f0c4a0','#4a2c1a']];
[[6.2,-0.45],[5.7,0.35],[3.2,-0.3],[2.7,0.4],[0.2,-0.2],[-2.6,0.3],[-3.3,-0.35]].forEach(([y,dx],i)=>{const c=SPEC[i%SPEC.length];spectators.push({x:-8.7+dx,y,shirt:c[0],pants:c[1],skin:c[2],hair:c[3],ph:i*1.7,cheer:0})});
setHelp();newMatch(true);
let last=performance.now(),acc=0;
function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(net&&net.role==='guest'&&!demo)guestTick(dt);
  else if((!paused||(net&&!demo))&&state!=='over'){acc+=dt;while(acc>=STEP){update(STEP);acc-=STEP}}
  if(net&&net.role==='host'&&!demo&&net.conn&&net.conn.open){net.sendT-=dt;if(net.sendT<=0){net.sendT=1/30;netSend(mkSnap())}}
  updMascot(dt);render();drawPreview();requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script>
